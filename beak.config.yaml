# Beak configuration. See plan.md §12.

models:
  # Each entry is a pi provider + model id; `pi --list-models` shows what your credentials unlock.
  # GLM-5.3 is in pi's catalog under several providers, e.g. zai (glm-5.3), openrouter (z-ai/glm-5.3),
  # opencode (glm-5.3) and vercel-ai-gateway (zai/glm-5.3). Change `provider` to the one you have a key for.
  writer: { provider: zai, model: glm-5.3 }   # the interactive pi session model (you pick it in pi; listed for reference)
  tester: { provider: zai, model: glm-5.3 }   # simulates the consumer agent in `beak test`
  judge:  { provider: zai, model: glm-5.3 }   # TODO (plan §14, Q2): a different model is recommended for the judge

runner: pi            # pi | fake  (the BEAK_RUNNER environment variable overrides this)

consumers: [sales-agent, support-agent]

loop:
  max_rounds: 4
  pass_threshold: 85
  min_delta: 3
  patience: 2
  test_inputs: 3
  holdout: 1          # outputs judged, but details hidden from the writer
  judge_samples: 1    # >1 = majority vote per criterion

paths: { library: library, runs: runs, drafts: drafts, out: out }

git: { commit_on_approve: true, track_runs: false }

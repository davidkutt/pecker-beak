# Beak configuration. See plan.md §12.

# The models you can pick from. Each is a pi provider + model id (`pi --list-models deepseek` shows
# what your credentials unlock). Always name the provider: OpenRouter ids contain a slash.
models:
  glm-5.3:           { provider: openrouter, model: z-ai/glm-5.3 }
  deepseek-v4-flash: { provider: openrouter, model: deepseek/deepseek-v4-flash }

# Which model does what. Switch by changing the name; tester and judge may be the same model.
# Per run: /compose … tester=<name> judge=<name>.
# The writer is your interactive pi session: its model is set in .pi/settings.json (Ctrl+P switches).
roles:
  tester: glm-5.3             # simulates the consumer agent in `beak test`
  judge:  deepseek-v4-flash   # grades the outputs in `beak judge`

runner: pi            # pi | fake  (the BEAK_RUNNER environment variable overrides this)

consumers: [sales-agent, support-agent]

loop:
  max_rounds: 4
  pass_threshold: 85
  min_delta: 3
  patience: 2
  test_inputs: 3
  holdout: 1          # outputs judged, but details hidden from the writer
  judge_samples: 1    # >1 = majority vote per criterion

paths: { library: library, runs: runs, drafts: drafts, out: out }

git: { commit_on_approve: true, track_runs: false }
